version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: netflix-postgres
    environment:
      POSTGRES_DB: netflix_db
      POSTGRES_USER: netflix_admin
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix_admin -d netflix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netflix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: netflix-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: netflix-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: netflix-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: netflix-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - JWT_SECRET=supersecretnetflixkey123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    container_name: netflix-user-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretnetflixkey123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: netflix-catalog-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  streaming-service:
    build:
      context: ./services/streaming
      dockerfile: Dockerfile
    container_name: netflix-streaming-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - CLOUDFRONT_DOMAIN=d111111abcdef8.cloudfront.net
      - CLOUDFRONT_KEY_PAIR_ID=K3A1A2A3A4A5A6
      - CLOUDFRONT_PRIVATE_KEY=mock-private-key-content-goes-here
    depends_on:
      - catalog-service

  metadata-service:
    build:
      context: ./services/metadata
      dockerfile: Dockerfile
    container_name: netflix-metadata-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build:
      context: ./services/recommendation
      dockerfile: Dockerfile
    container_name: netflix-recommendation-service
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  search-service:
    build:
      context: ./services/search
      dockerfile: Dockerfile
    container_name: netflix-search-service
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    container_name: netflix-billing-service
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: netflix-notification-service
    ports:
      - "5009:5009"
    environment:
      - PORT=5009
      - DATABASE_URL=postgresql://netflix_admin:Password123!@postgres:5432/netflix_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_AUTH_SERVICE_URL=http://localhost:5001
      - VITE_CATALOG_SERVICE_URL=http://localhost:5002
      - VITE_STREAMING_SERVICE_URL=http://localhost:5003
      - VITE_USER_SERVICE_URL=http://localhost:5004
      - VITE_METADATA_SERVICE_URL=http://localhost:5005
      - VITE_RECOMMENDATION_SERVICE_URL=http://localhost:5006
      - VITE_SEARCH_SERVICE_URL=http://localhost:5007
      - VITE_BILLING_SERVICE_URL=http://localhost:5008
      - VITE_NOTIFICATION_SERVICE_URL=http://localhost:5009
    depends_on:
      - auth-service
      - user-service
      - catalog-service
      - streaming-service
      - metadata-service
      - recommendation-service
      - search-service
      - billing-service
      - notification-service

volumes:
  postgres_data:
