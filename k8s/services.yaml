apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: netflix
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: netflix
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: netflix
  labels:
    app: user-service
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: user-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: netflix
  labels:
    app: catalog-service
spec:
  ports:
    - port: 5002
      targetPort: 5002
  selector:
    app: catalog-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: netflix
  labels:
    app: streaming-service
