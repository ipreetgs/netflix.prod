# Services for workloads defined in deployments.yaml and rollouts/
# Note: auth, metadata, recommendation, search, billing, notification services
# are defined in additional-services-routing.yaml

# --- Infrastructure Services ---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: netflix
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: netflix
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
  type: ClusterIP

# --- Application Services ---

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: netflix
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: netflix
spec:
  ports:
    - port: 5004
      targetPort: 5004
  selector:
    app: user-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: netflix
spec:
  ports:
    - port: 5002
      targetPort: 5002
  selector:
    app: catalog-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: netflix
spec:
  ports:
    - port: 5003
      targetPort: 5003
  selector:
    app: streaming-service
  type: ClusterIP
