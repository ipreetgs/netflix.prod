apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: streaming-service
  namespace: netflix
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      labels:
        app: streaming-service
    spec:
      containers:
        - name: streaming-service
          image: <your-registry>/netflix-streaming-service:latest
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:5002
            - name: CLOUDFRONT_DOMAIN
              value: d111111abcdef8.cloudfront.net
            - name: CLOUDFRONT_KEY_PAIR_ID
              value: K3A1A2A3A4A5A6
            - name: CLOUDFRONT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudfront-secrets
                  key: private-key
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 5m }
        - setWeight: 100
