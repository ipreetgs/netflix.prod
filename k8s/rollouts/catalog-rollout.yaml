apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: catalog-service
  namespace: netflix
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: gurpreetghs/netflix-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-url
            - name: REDIS_URL
              value: redis://redis-service:6379
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
  strategy:
    canary:
      # In production, route traffic using an ALB or Service Mesh (e.g. Istio)
      # here we define the progressive canary weight steps
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: catalog-service
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 30
        # Wait for manual promotion or automated validation
        - pause: {} 
        - setWeight: 60
        - pause: { duration: 10m }
        - setWeight: 100
